name: "Spike / Research"
description: "Technische oder fachliche Recherche zur Entscheidungsfindung"
labels: ["type:spike"]
body:
  - type: textarea
    id: question
    attributes:
      label: "Fragestellung"
      description: "Was soll durch diesen Spike beantwortet werden?"
    validations:
      required: true

  - type: textarea
    id: hypotheses
    attributes:
      label: "Hypothesen"
      description: "Welche Annahmen oder Erwartungen gibt es?"
    validations:
      required: false

  - type: textarea
    id: approach
    attributes:
      label: "Vorgehen / Plan"
      description: "Wie soll recherchiert werden? Welche Quellen, Tests, PoCs?"
    validations:
      required: true

  - type: dropdown
    id: result_format
    attributes:
      label: "Erwartetes Ergebnisformat"
      description: "In welcher Form soll das Ergebnis dokumentiert werden?"
      options:
        - "Entscheidung + Empfehlung"
        - "Pro-Contra"
        - "PoC"
    validations:
      required: true

  - type: dropdown
    id: timebox
    attributes:
      label: "Timebox"
      description: "Maximale Zeit für diesen Spike"
      options:
        - "1h"
        - "2h"
        - "4h"
        - "1d"
    validations:
      required: true
